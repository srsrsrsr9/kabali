# Publishes web/ — the Supabase-backed build — to GitHub Pages.
#
# Replaces the Jekyll sample workflow: there is no Jekyll site here, just
# static files, and Jekyll would have published the repo root (the
# device-only build) rather than web/.
name: Deploy tracker to GitHub Pages

on:
  push:
    branches: ["claude/school-rental-research-g3jthf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload web/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
