<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F5; --surface-3:#E3E9EF;
  --ink:#141D26; --ink-2:#4C5A6A; --ink-3:#74838F;
  --rule:#DCE3EA; --rule-strong:#B9C4CF;
  --accent:#1B5FB0; --accent-soft:#E7EFFA; --on-accent:#FFFFFF;
  --go:#166B45; --go-bg:#E2F1E9;
  --warn:#95610A; --warn-bg:#F7EEDC;
  --stop:#9E3229; --stop-bg:#F7E5E2;
  --idle:#5D6B79; --idle-bg:#E8EDF2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D131A; --surface:#151E27; --surface-2:#1C2732; --surface-3:#243140;
    --ink:#E4EAF0; --ink-2:#A2B0BE; --ink-3:#7B8996;
    --rule:#26323E; --rule-strong:#3A4854;
    --accent:#79ADEF; --accent-soft:#16283C; --on-accent:#0D131A;
    --go:#5CC38C; --go-bg:#12291F;
    --warn:#DFAE55; --warn-bg:#2C2314;
    --stop:#E88C7F; --stop-bg:#2E1A18;
    --idle:#93A1B1; --idle-bg:#1E2933;
  }
}
:root[data-theme="dark"]{
  --ground:#0D131A; --surface:#151E27; --surface-2:#1C2732; --surface-3:#243140;
  --ink:#E4EAF0; --ink-2:#A2B0BE; --ink-3:#7B8996;
  --rule:#26323E; --rule-strong:#3A4854;
  --accent:#79ADEF; --accent-soft:#16283C; --on-accent:#0D131A;
  --go:#5CC38C; --go-bg:#12291F;
  --warn:#DFAE55; --warn-bg:#2C2314;
  --stop:#E88C7F; --stop-bg:#2E1A18;
  --idle:#93A1B1; --idle-bg:#1E2933;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4,button,th,label,.ui{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.mono,td.n,input,select,textarea,.tile-v,.tel{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.app{max-width:1240px;margin:0 auto;padding:0 16px 90px}

.hdr{background:var(--surface);border-bottom:1px solid var(--rule)}
.hdr-in{max-width:1240px;margin:0 auto;padding:18px 16px 0;display:flex;flex-direction:column;gap:15px}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
h1{font-size:1.34rem;letter-spacing:-.018em;font-weight:700;margin:0;line-height:1.15}
.sub{font-size:.82rem;color:var(--ink-3);margin-top:3px}
.sync{display:flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.03em;color:var(--ink-3);border:1px solid var(--rule);padding:5px 10px;border-radius:20px;white-space:nowrap}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.sync.cloud .led{background:var(--go)}
.sync.local .led{background:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:0;border-top:1px solid var(--rule)}
.tile{padding:12px 14px 12px 0;border-right:1px solid var(--rule)}
.tile:last-child{border-right:none}
.tile-k{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;font-family:Archivo,sans-serif}
.tile-v{font-size:1.18rem;font-weight:600;margin:2px 0 0;display:block;line-height:1.2}
.tile-v small{font-size:.7rem;color:var(--ink-3);font-weight:400}
nav.tabs{display:flex;overflow-x:auto}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-3);font-size:.82rem;font-weight:600;padding:11px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 13px}
.bar .spacer{flex:1}
input,select,textarea{font-size:.82rem;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);padding:7px 9px;border-radius:3px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:58px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
button.btn{font-size:.78rem;font-weight:600;padding:7px 13px;border-radius:3px;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong)}
button.btn:hover{background:var(--surface-2)}
button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.btn.ghost{border-color:transparent;color:var(--ink-3)}
button.btn.ghost:hover{color:var(--stop);background:var(--stop-bg)}

.chip{display:inline-block;font-family:Archivo,sans-serif;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:3px 7px;border-radius:2px;white-space:nowrap}
.c-go{background:var(--go-bg);color:var(--go)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-stop{background:var(--stop-bg);color:var(--stop)}
.c-idle{background:var(--idle-bg);color:var(--idle)}
.c-acc{background:var(--accent-soft);color:var(--accent)}

/* call affordance */
.call{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);text-decoration:none;
  font-family:Archivo,sans-serif;font-size:.78rem;font-weight:600;padding:8px 14px;border-radius:3px;white-space:nowrap}
.call:hover{filter:brightness(1.08)}
.call.sm{padding:5px 10px;font-size:.72rem}
.call[aria-disabled="true"]{background:var(--surface-2);color:var(--ink-3);pointer-events:none}
.tel{font-size:.74rem;color:var(--ink-2);display:block;margin-top:3px;word-break:break-all}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.scroller{overflow-x:auto;border:1px solid var(--rule);background:var(--surface);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:940px;font-size:.85rem}
th{font-family:Archivo,sans-serif;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule-strong);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.open td{background:var(--surface-2)}
td.n{font-size:.78rem;color:var(--ink-2);white-space:nowrap}
td.nm{font-family:Archivo,sans-serif;font-weight:600;font-size:.87rem;min-width:180px;cursor:pointer}
td.nm .a{display:block;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3);font-weight:400;margin-top:2px}
td.nm .flags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
tbody tr:last-child td{border-bottom:none}
select.mini{font-size:.74rem;padding:4px 6px;max-width:148px}

/* mobile cards */
.cards{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px}
.scard.hi{border-color:var(--accent)}
.scard h3{font-size:.98rem;margin:0;letter-spacing:-.005em}
.scard .a{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3);margin-top:2px}
.scard .flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.scard .meta{display:flex;gap:14px;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-2);flex-wrap:wrap}
.scard .meta b{color:var(--ink-3);font-weight:500}
.scard .acts{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.scard .picks{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.scard .picks select{flex:1;min-width:132px}
.scard .body{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:12px}

.detail{background:var(--surface-2);border-bottom:1px solid var(--rule)}
.detail-in{padding:18px 14px 22px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.detail-in{grid-template-columns:1fr}}
.qlist{display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--surface);border-radius:4px}
.q{padding:12px 13px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:7px}
.q:last-child{border-bottom:none}
.q-h{display:flex;gap:9px;align-items:baseline}
.q-n{font-family:"IBM Plex Mono",monospace;font-size:.67rem;font-weight:600;color:var(--ink-3);flex:none}
.q-t{font-size:.86rem;line-height:1.45}
.q-hint{font-size:.75rem;color:var(--ink-3);display:block;margin-top:3px;font-style:normal}
.side{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:.63rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--ink-3)}
.fld input,.fld select{width:100%}

.phase{margin-bottom:24px}
.phase-h{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.phase-when{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:600;letter-spacing:.05em;color:var(--accent);text-transform:uppercase}
.phase-c{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3);margin-left:auto}
.tasks{display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--surface);border-radius:4px}
.task{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-bottom:1px solid var(--rule);cursor:pointer}
.task:last-child{border-bottom:none}
.task:hover{background:var(--surface-2)}
.task input{margin:3px 0 0;accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer}
.task span{font-size:.89rem;line-height:1.45}
.task.done span{color:var(--ink-3);text-decoration:line-through}

.prose{max-width:66ch;display:flex;flex-direction:column;gap:15px;font-size:.96rem;line-height:1.62}
.prose h3{font-size:1.01rem;margin:9px 0 0}
.note{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.note.w{border-left-color:var(--warn)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border:1px solid var(--rule);background:var(--surface);border-radius:4px}
.cfg>div{padding:16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.cfg>div:last-child{border-right:none}
.cfg .pick{background:var(--accent-soft)}
.lg{font-family:"IBM Plex Mono",monospace;font-size:.77rem;display:flex;flex-direction:column;gap:4px}
.lg b{color:var(--ink-3);font-weight:500}
.empty{padding:32px 18px;text-align:center;color:var(--ink-3);font-size:.89rem}
.err{background:var(--stop-bg);color:var(--stop);border:1px solid var(--stop);padding:9px 13px;border-radius:3px;font-size:.8rem;margin:13px 0}
.warnbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);padding:10px 13px;border-radius:3px;font-size:.82rem;margin:13px 0;line-height:1.5}
.warnbar strong{display:block;margin-bottom:3px}
.sync.none .led{background:var(--stop)}
.backup{margin:14px 0;border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.backup textarea{min-height:120px;font-size:.72rem;line-height:1.45}
.backup .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.backup .msg{font-size:.78rem}
.backup .msg.ok{color:var(--go)}
.backup .msg.bad{color:var(--stop)}
.hint{font-size:.78rem;color:var(--ink-3);margin:10px 2px 0;line-height:1.5}
@media (max-width:640px){.tile{border-right:none;border-bottom:1px solid var(--rule)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ==========================================================
   STORE — db when hosted as an Artifact, localStorage elsewhere.
   ========================================================== */
var COLS = ["schools","rentals","tasks"];
var LS_KEY = "ddk-tracker-v1";

var store = (function(){
  var api=null, mode="loading", err=null, rev=0;
  var cache = {schools:{}, rentals:{}, tasks:{}};
  var subs = [];
  function notify(){ rev++; for(var i=0;i<subs.length;i++) subs[i](); }
  function lsUsable(){
    try{
      var k="__probe"+Date.now();
      localStorage.setItem(k,"1");
      var ok = localStorage.getItem(k)==="1";
      localStorage.removeItem(k);
      return ok;
    }catch(e){ return false; }
  }
  function saveLocal(){
    if (mode!=="local") return;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(cache)); }
    catch(e){ mode="none"; err="This browser stopped saving — probably out of space. Use Backup before you close the page."; notify(); }
  }
  function loadLocal(){
    try{
      var raw = JSON.parse(localStorage.getItem(LS_KEY)||"{}");
      COLS.forEach(function(c){ cache[c] = (raw && raw[c]) || {}; });
    }catch(e){}
  }
  function init(){
    var p=null;
    try{ if (window.claude && typeof window.claude.use === "function") p = window.claude.use("db"); }catch(e){ p=null; }
    function fallback(){
      if (lsUsable()){ mode="local"; loadLocal(); }
      else { mode="none"; }
      notify();
    }
    if (!p || typeof p.then !== "function"){ fallback(); return; }
    p.then(function(cap){
      if(!cap){ fallback(); return; }
      api=cap; mode="cloud";
      COLS.forEach(function(col){
        try{
          api.collection(col).onSnapshot(function(snap){
            var next={};
            snap.docs.forEach(function(d){ if(d.exists) next[d.id]=d.data(); });
            cache[col]=next; notify();
          }, function(e){
            err = (e&&e.code)==="revoked"
              ? "Your access to the saved data was withdrawn while the page was open. Reload to try again."
              : "Live sync stopped ("+((e&&e.code)||"unknown")+"). Your edits may not be saving — reload the page.";
            notify();
          });
        }catch(e){}
      });
      notify();
    }, fallback);
  }
  init();
  return {
    subscribe:function(fn){ subs.push(fn); return function(){ subs = subs.filter(function(f){return f!==fn;}); }; },
    mode:function(){ return mode; },
    rev:function(){ return rev; },
    error:function(){ return err; },
    all:function(col){ return cache[col]||{}; },
    get:function(col,id){ return (cache[col]||{})[id]||null; },
    put:function(col,id,patch){
      var cur=(cache[col]||{})[id]||{};
      var next=Object.assign({},cur,patch,{updatedAt:new Date().toISOString()});
      cache[col][id]=next; notify();
      if(mode==="cloud"&&api){
        api.doc(col+"/"+id).set(next).catch(function(e){
          err = (e&&e.code)==="quota_exceeded"
            ? "The saved store is full — delete some rental entries before adding more."
            : "That change did not save ("+((e&&e.code)||"unknown")+"). Try again.";
          notify();
        });
      } else saveLocal();
    },
    remove:function(col,id){
      delete cache[col][id]; notify();
      if(mode==="cloud"&&api){ api.doc(col+"/"+id).delete().catch(function(){}); }
      else saveLocal();
    },
    newId:function(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); },
    exportJSON:function(){
      return JSON.stringify({format:"ddk-tracker", version:1, exportedAt:new Date().toISOString(), data:cache}, null, 2);
    },
    importJSON:function(text){
      var parsed;
      try{ parsed = JSON.parse(text); }
      catch(e){ return "That is not valid JSON — paste the whole backup, including the outer braces."; }
      var d = parsed && parsed.data;
      if (!d || typeof d !== "object") return "No tracker data found in that text. Expected a backup with a \"data\" section.";
      var wrote = 0;
      COLS.forEach(function(col){
        var incoming = d[col];
        if (!incoming || typeof incoming !== "object") return;
        Object.keys(incoming).forEach(function(id){
          var row = incoming[id];
          if (!row || typeof row !== "object") return;
          cache[col][id] = Object.assign({}, cache[col][id] || {}, row);
          wrote++;
          if (mode==="cloud" && api){ api.doc(col+"/"+id).set(cache[col][id]).catch(function(){}); }
        });
      });
      saveLocal(); notify();
      return wrote ? null : "That backup was empty — nothing to restore.";
    }
  };
})();

function useStore(){
  var s=useState(0), tick=s[1];
  useEffect(function(){ return store.subscribe(function(){ tick(function(v){return v+1;}); }); },[]);
  return store;
}
function useNarrow(){
  var q = "(max-width: 760px)";
  var s = useState(typeof window.matchMedia === "function" ? window.matchMedia(q).matches : false);
  var v = s[0], set = s[1];
  useEffect(function(){
    if (typeof window.matchMedia !== "function") return;
    var m = window.matchMedia(q), fn = function(e){ set(e.matches); };
    if (m.addEventListener) m.addEventListener("change", fn); else m.addListener(fn);
    return function(){ if (m.removeEventListener) m.removeEventListener("change", fn); else m.removeListener(fn); };
  },[]);
  return v;
}

/* ==========================================================
   BACKUP — the escape hatch when the page cannot save itself
   ========================================================== */
function BackupPanel(props){
  var s = props.s;
  var t = useState(""), text = t[0], setText = t[1];
  var m = useState(null), msg = m[0], setMsg = m[1];

  function fill(){ setText(s.exportJSON()); setMsg({ok:true, t:"Everything you have entered is in the box. Copy it somewhere safe."}); }
  function copy(){
    var payload = text || s.exportJSON();
    setText(payload);
    function fallback(){
      try{
        var ta=document.createElement("textarea");
        ta.value=payload; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy");
        document.body.removeChild(ta);
        setMsg({ok:true, t:"Copied. Paste it into a note or email to yourself."});
      }catch(e){ setMsg({ok:false, t:"Could not copy automatically — select the text in the box and copy it by hand."}); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(payload).then(function(){
        setMsg({ok:true, t:"Copied. Paste it into a note or email to yourself."});
      }, fallback);
    } else fallback();
  }
  function download(){
    var payload = text || s.exportJSON();
    setText(payload);
    try{
      var blob = new Blob([payload], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "ddk-tracker-backup.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      setMsg({ok:true, t:"Saved as ddk-tracker-backup.json. On a phone this sometimes does nothing — use Copy instead."});
    }catch(e){ setMsg({ok:false, t:"Download blocked here. Use Copy instead."}); }
  }
  function restore(){
    if (!text.trim()){ setMsg({ok:false, t:"Paste a backup into the box first."}); return; }
    var problem = s.importJSON(text);
    setMsg(problem ? {ok:false, t:problem} : {ok:true, t:"Restored. Your entries are merged back in."});
  }

  return T.div({className:"backup"},
    T.strong({style:{fontFamily:"Archivo,sans-serif", fontSize:".8rem"}}, "Backup and restore"),
    T.p({style:{fontSize:".82rem", color:"var(--ink-2)"}},
      s.mode()==="cloud"
        ? "Your entries are saved for you and follow you between devices. A copy is still worth keeping before any big change — paste it into a note."
        : "Everything you type lives in this browser on this device. Copy a backup before you clear browsing data, switch phones, or if the badge above is not green."),
    T.div({className:"row"},
      T.button({className:"btn", onClick:fill}, "Show my data"),
      T.button({className:"btn primary", onClick:copy}, "Copy backup"),
      s.mode()==="cloud" ? null : T.button({className:"btn", onClick:download}, "Download"),
      T.button({className:"btn", onClick:restore}, "Restore from box")),
    T.textarea({value:text, onChange:function(e){ setText(e.target.value); },
      placeholder:"Press \u201CShow my data\u201D to fill this, or paste a saved backup here and press Restore."}),
    msg ? T.p({className:"msg "+(msg.ok?"ok":"bad")}, msg.t) : null);
}

function App(){

  var recs=s.all("schools");

  var counts = useMemo(function(){
    var called=0, shortlist=0, tel=0;
    SCHOOLS.forEach(function(sc){
      var r=recs[sc.id]; if(!r) return;
      if(r.status==="called"||r.status==="shortlist"||r.status==="reject") called++;
      if(r.status==="shortlist") shortlist++;
      if(r.telugu==="r2"||r.telugu==="r3") tel++;
    });
    return {called:called, shortlist:shortlist, tel:tel};
  },[s.rev()]);

  var rentals=s.all("rentals");
  var rShort=Object.keys(rentals).filter(function(i){return rentals[i].status==="shortlist";}).length;
  var tasks=s.all("tasks");
  var totalTasks=PHASES.reduce(function(a,p){return a+p.tasks.length;},0);
  var doneTasks=Object.keys(tasks).filter(function(k){return tasks[k].done;}).length;
  var days=Math.max(0, Math.ceil((new Date(2027,1,28) - new Date())/86400000));

  var TABS=[["schools","Schools"],["rentals","Rentals"],["timeline","Timeline"],["brief","The brief"]];

  return T.div(null,
    T.header({className:"hdr"}, T.div({className:"hdr-in"},
      T.div({className:"hdr-top"},
        T.div(null,
          T.h1(null,"Doddanekkundi Tracker"),
          T.p({className:"sub"},"Grade 9 and Grade 5 into east Bengaluru, AY 2027–28 · IndiQube ETA, ORR")),
        T.div({className:"sync "+(mode==="cloud"?"cloud":mode==="local"?"local":mode==="none"?"none":"")},
          T.span({className:"led"}),
          mode==="cloud"?"Synced across your devices"
            :mode==="local"?"Saved in this browser only"
            :mode==="none"?"NOT saving — copy a backup"
            :"Connecting…")),
      T.dl({className:"tiles"},
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Schools"), T.dd({className:"tile-v"}, SCHOOLS.length)),
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Contacted"), T.dd({className:"tile-v"}, counts.called, T.small(null," / "+SCHOOLS.length))),
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Shortlisted"), T.dd({className:"tile-v", style:{color:counts.shortlist?"var(--go)":"inherit"}}, counts.shortlist)),
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Telugu: yes"), T.dd({className:"tile-v", style:{color:counts.tel?"var(--go)":"inherit"}}, counts.tel)),
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Places"), T.dd({className:"tile-v"}, Object.keys(rentals).length, T.small(null," · "+rShort+" short"))),
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Steps done"), T.dd({className:"tile-v"}, doneTasks, T.small(null," / "+totalTasks))),
        T.div({className:"tile"}, T.dt({className:"tile-k"},"Days left"), T.dd({className:"tile-v"}, days, T.small(null," to Feb 27")))),
      h("nav",{className:"tabs", role:"tablist"}, TABS.map(function(x){
        return T.button({key:x[0], role:"tab", "aria-selected":tab===x[0], onClick:function(){ setTab(x[0]); }}, x[1]);
      })))),
    T.main({className:"app"},
      err ? T.div({className:"err"}, err) : null,
      mode==="none" ? T.div({className:"warnbar"},
        T.strong(null,"This copy cannot save anything."),
        "Your browser is refusing local storage, which is common when an HTML file is opened straight off the filesystem rather than served over http. You can still read the page and tap the numbers, but anything you type will be gone when you close the tab. Copy a backup from the panel at the bottom of the Timeline tab before you close it — or use the hosted copy, where notes are saved for you.") : null,
      mode==="local" ? T.div({className:"warnbar"},
        T.strong(null,"Saved on this device only."),
        "Notes typed here stay in this one browser: they will not appear on your laptop, and clearing browsing data erases them. The Backup panel at the bottom of the Timeline tab is how you move them.") : null,
      tab==="schools" ? h(SchoolsView) :
      tab==="rentals" ? h(RentalsView) :
      tab==="timeline" ? T.div(null, h(TimelineView), h(BackupPanel,{s:s})) : h(BriefView))
  );
}
