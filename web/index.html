<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tracker for the east Bengaluru school search and house hunt, AY 2027-28.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DDK Tracker">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9E%3C/text%3E%3C/svg%3E">
<title>Doddanekkundi Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"><noscript>This tracker needs JavaScript enabled.</noscript></div>

<!-- Vendored rather than pulled from a CDN: no third-party runtime
     dependency, and the page keeps working offline once cached. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/supabase.js"></script>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>

<script>
(function () {
  var root = document.getElementById("root");
  if (typeof React === "undefined" || typeof ReactDOM === "undefined" || !window.TrackerApp) {
    root.innerHTML =
      '<div style="font:15px/1.6 system-ui,sans-serif;max-width:34em;margin:12vh auto;padding:0 20px">' +
      '<h1 style="font-size:1.2rem;margin:0 0 12px">This page could not start</h1>' +
      '<p style="margin:0 0 10px">One of the scripts in vendor/ did not load. Check that the whole folder was deployed.</p>' +
      '<p style="margin:0;color:#666">If reloading does not help, check the browser console: a missing config.js or a ' +
      'syntax error in one of the scripts will stop the page here.</p></div>';
    return;
  }
  ReactDOM.createRoot(root).render(React.createElement(window.TrackerApp));
})();
</script>
</body>
</html>
